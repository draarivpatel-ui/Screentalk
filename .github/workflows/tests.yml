name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/rules.test.js     # rules/content + rehearsal + English/Spanish + offline service worker
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/e2e_test.py     # real-browser checks: flows, Spanish, print fit, contrast, offline
      - run: python tests/axe_states_test.py   # axe-core: 11 states x 390/1280 x EN/ES, plus a language switch mid-flow
